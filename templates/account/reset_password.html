{% extends "base.html" %}
{% block title %}Set New Password — {{ store_name }}{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:440px;">
  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-body p-4">
      <h3 class="mb-1 fw-bold">Set New Password</h3>
      <p class="text-muted mb-4" style="font-size:.92rem;">Choose a strong password for your account.</p>

      <form method="post" action="{{ url_for('customer_reset_password', token=token) }}">
        <div class="mb-3">
          <label class="form-label fw-semibold">New Password</label>
          <input type="password" name="password" class="form-control"
                 minlength="8" placeholder="Min 8 characters" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Confirm New Password</label>
          <input type="password" name="confirm_password" class="form-control"
                 minlength="8" required>
        </div>
        <button type="submit" class="btn btn-warning w-100 fw-bold py-2">
          <i class="bi bi-lock me-1"></i> Update Password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
