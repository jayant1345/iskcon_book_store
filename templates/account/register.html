{% extends "base.html" %}
{% block title %}Create Account — {{ store_name }}{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:480px;">
  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-body p-4">
      <h3 class="mb-1 fw-bold">Create Account</h3>
      <p class="text-muted mb-4">Save your details &amp; track orders easily.</p>

      <form method="post" action="{{ url_for('customer_register') }}">
        <div class="mb-3">
          <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" value="{{ name }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
          <input type="email" name="email" class="form-control" value="{{ email }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Mobile Number <span class="text-danger">*</span></label>
          <input type="tel" name="phone" class="form-control" value="{{ phone }}"
                 pattern="[6-9][0-9]{9}" maxlength="10" placeholder="10-digit mobile" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
          <input type="password" name="password" class="form-control"
                 minlength="8" placeholder="Min 8 characters" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
          <input type="password" name="confirm_password" class="form-control" minlength="8" required>
        </div>

        <button type="submit" class="btn btn-warning w-100 fw-bold py-2">
          <i class="bi bi-person-plus me-1"></i> Create Account
        </button>
      </form>

      <hr class="my-3">
      <p class="text-center mb-0 text-muted" style="font-size:.9rem;">
        Already have an account?
        <a href="{{ url_for('customer_login') }}" class="fw-semibold text-warning">Log in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
