{% extends "base.html" %}
{% block title %}My Account Login — {{ store_name }}{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:440px;">
  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-body p-4">
      <h3 class="mb-1 fw-bold">Log In</h3>
      <p class="text-muted mb-4">Access your orders and saved details.</p>

      <form method="post" action="{{ url_for('customer_login') }}">
        <input type="hidden" name="next" value="{{ next }}">

        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address</label>
          <input type="email" name="email" class="form-control" value="{{ email }}" required autofocus>
        </div>
        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center">
            <label class="form-label fw-semibold mb-0">Password</label>
            <a href="{{ url_for('customer_forgot_password') }}"
               class="text-muted" style="font-size:.85rem;">Forgot password?</a>
          </div>
          <input type="password" name="password" class="form-control mt-1" required>
        </div>

        <button type="submit" class="btn btn-warning w-100 fw-bold py-2">
          <i class="bi bi-box-arrow-in-right me-1"></i> Log In
        </button>
      </form>

      <hr class="my-3">
      <p class="text-center mb-0 text-muted" style="font-size:.9rem;">
        New here?
        <a href="{{ url_for('customer_register') }}" class="fw-semibold text-warning">Create an account</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
