{% extends "base.html" %}
{% block title %}Forgot Password — {{ store_name }}{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:440px;">
  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-body p-4">
      <h3 class="mb-1 fw-bold">Forgot Password?</h3>
      <p class="text-muted mb-4" style="font-size:.92rem;">
        Enter your registered email and we'll send you a reset link.
      </p>

      <form method="post" action="{{ url_for('customer_forgot_password') }}">
        <div class="mb-4">
          <label class="form-label fw-semibold">Email Address</label>
          <input type="email" name="email" class="form-control" required autofocus
                 placeholder="you@example.com">
        </div>
        <button type="submit" class="btn btn-warning w-100 fw-bold py-2">
          <i class="bi bi-envelope me-1"></i> Send Reset Link
        </button>
      </form>

      <hr class="my-3">
      <p class="text-center mb-0 text-muted" style="font-size:.9rem;">
        Remembered it?
        <a href="{{ url_for('customer_login') }}" class="fw-semibold text-warning">Back to Login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
