{% extends "base.html" %}
{% block title %}Edit Profile — {{ store_name }}{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:500px;">
  <div class="d-flex align-items-center gap-3 mb-4">
    <a href="{{ url_for('customer_dashboard') }}" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left"></i>
    </a>
    <h3 class="mb-0 fw-bold">Edit Profile</h3>
  </div>

  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-body p-4">
      <form method="post" action="{{ url_for('customer_profile') }}">
        <div class="mb-3">
          <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" value="{{ customer.name }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address</label>
          <input type="email" class="form-control" value="{{ customer.email }}" disabled>
          <small class="text-muted">Email cannot be changed.</small>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Mobile Number <span class="text-danger">*</span></label>
          <input type="tel" name="phone" class="form-control" value="{{ customer.phone }}"
                 pattern="[6-9][0-9]{9}" maxlength="10" required>
        </div>

        <hr>
        <p class="fw-semibold mb-2">Saved Delivery Address</p>
        <div class="mb-3">
          <label class="form-label">Full Address</label>
          <textarea name="saved_address" class="form-control" rows="2"
                    placeholder="House No., Street, Area">{{ customer.saved_address or '' }}</textarea>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-5">
            <label class="form-label">City</label>
            <input type="text" name="saved_city" class="form-control"
                   value="{{ customer.saved_city or '' }}" placeholder="Mumbai">
          </div>
          <div class="col-4">
            <label class="form-label">State</label>
            <input type="text" name="saved_state" class="form-control"
                   value="{{ customer.saved_state or '' }}" placeholder="Maharashtra">
          </div>
          <div class="col-3">
            <label class="form-label">PIN Code</label>
            <input type="text" name="saved_pincode" class="form-control"
                   value="{{ customer.saved_pincode or '' }}" placeholder="400001"
                   pattern="[0-9]{6}" maxlength="6">
          </div>
        </div>

        <hr>
        <p class="fw-semibold mb-2">Change Password <small class="text-muted fw-normal">(leave blank to keep current)</small></p>
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <input type="password" name="new_password" class="form-control" minlength="8"
                 placeholder="Min 8 characters">
        </div>
        <div class="mb-4">
          <label class="form-label">Confirm New Password</label>
          <input type="password" name="confirm_password" class="form-control" minlength="8">
        </div>

        <button type="submit" class="btn btn-warning w-100 fw-bold py-2">
          <i class="bi bi-check-circle me-1"></i> Save Changes
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
