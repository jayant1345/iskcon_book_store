{% extends "base.html" %}
{% block title %}Pay via PayU — {{ store_name }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="success-card text-center">
    <div style="font-size:3rem;">🔒</div>
    <h4 class="mt-3">Redirecting to PayU...</h4>
    <p class="text-muted">Please wait, you are being securely redirected to complete your payment of
      <strong style="color:var(--saffron);">₹{{ order.total_amount|int }}</strong>
    </p>
    <div class="spinner-border text-warning mt-3" role="status"></div>

    <form id="payu-form" method="POST" action="{{ payu_url }}" style="display:none;">
      <input type="hidden" name="key"         value="{{ key }}">
      <input type="hidden" name="txnid"       value="{{ order.order_number }}">
      <input type="hidden" name="productinfo" value="ISKCON Books">
      <input type="hidden" name="amount"      value="{{ amount }}">
      <input type="hidden" name="firstname"   value="{{ firstname }}">
      <input type="hidden" name="email"       value="{{ email }}">
      <input type="hidden" name="phone"       value="{{ phone }}">
      <input type="hidden" name="surl"        value="{{ surl }}">
      <input type="hidden" name="furl"        value="{{ furl }}">
      <input type="hidden" name="hash"        value="{{ hash_val }}">
      <input type="hidden" name="service_provider" value="payu_paisa">
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  window.addEventListener('load', function () {
    document.getElementById('payu-form').submit();
  });
</script>
{% endblock %}
